<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img"><title>Resume Builder: Django, SQLite, Bootstrap. Collect details, store information, generate a structured resume. Workflow illustration.</title><rect width="1200" height="368" fill="#F2EFE6"/><text x="45" y="43" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#BC482C">SELECTED PROJECT</text><text x="45" y="114" font-family="Georgia, serif" font-size="54" font-weight="400" letter-spacing="-1" fill="#252923">Resume Builder</text><text x="45" y="164" font-family="Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#252923">A Django application for turning personal</text><text x="45" y="196" font-family="Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0" fill="#252923">and career details into a structured resume.</text><path d="M45 235L596 235" stroke="#CCCDBF"/><text x="45" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#252923">Django</text><text x="155" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#252923">SQLite</text><text x="254" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#252923">Bootstrap</text><text x="45" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#BC482C">VIEW SOURCE ON GITHUB  ↗</text><path d="M650 40L650 329" stroke="#CCCDBF"/><text x="690" y="78" font-family="Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0" fill="#BC482C">01</text><text x="744" y="78" font-family="Georgia, serif" font-size="24" font-weight="400" letter-spacing="0" fill="#252923">Collect</text><text x="744" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0" fill="#6C7066">Personal details, education, skills</text><path d="M744 131L11